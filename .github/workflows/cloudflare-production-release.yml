name: PSR Cloudflare production release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PSR to allow the production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: psr-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_NAME: psrhomes.ae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: chmod +x scripts/*.sh
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
      - name: Read-only live Cloudflare audit
        run: node scripts/audit-cloudflare-runtime.mjs
      - name: Build and source tests
        run: npm run test:source
      - name: Validate production manifests
        run: |
          npx wrangler deploy --dry-run --config wrangler.media-edge.jsonc
          npx wrangler deploy --dry-run --config wrangler.home-edge.jsonc
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --dry-run --config wrangler.jumanah-presentation-edge.jsonc
      - name: Verify production media before deployment
        env:
          PSR_MEDIA_BASE_URL: https://psrhomes.ae
          PSR_MEDIA_CONCURRENCY: "20"
          PSR_MEDIA_TIMEOUT_MS: "12000"
        run: |
          npx tsx scripts/audit-brochure-readiness.ts
          node scripts/verify-production-media.mjs
          node scripts/verify-r2-manifest.mjs
      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psr-cloudflare-preflight
          path: outputs/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: preflight
    if: ${{ github.event.inputs.confirm == 'DEPLOY_PSR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_NAME: psrhomes.ae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: chmod +x scripts/*.sh
      - name: Deploy canonical outer router first
        run: npx wrangler deploy --config wrangler.media-edge.jsonc
      - name: Deploy downstream home edge as service-only
        run: npx wrangler deploy --config wrangler.home-edge.jsonc
      - name: Deploy PSR origin and apply Sonu Durable Object rename
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Post-deploy runtime audit
        run: node scripts/audit-cloudflare-runtime.mjs
      - name: Post-deploy media and brochure acceptance
        env:
          PSR_MEDIA_BASE_URL: https://psrhomes.ae
          PSR_MEDIA_CONCURRENCY: "20"
          PSR_MEDIA_TIMEOUT_MS: "12000"
        run: |
          npx tsx scripts/audit-brochure-readiness.ts
          node scripts/verify-production-media.mjs
          node scripts/verify-r2-manifest.mjs
      - name: Upload post-deploy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psr-cloudflare-post-deploy
          path: outputs/
          if-no-files-found: ignore
          retention-days: 30
