name: Cloudflare Runtime Audit

on:
  pull_request:
    paths:
      - "scripts/audit-cloudflare-runtime.mjs"
      - ".github/workflows/cloudflare-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Read-only Cloudflare inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_NAME: psrhomes.ae
        run: node scripts/audit-cloudflare-runtime.mjs
      - name: Upload runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-runtime-audit
          path: outputs/cloudflare-runtime-audit.json
          if-no-files-found: warn
