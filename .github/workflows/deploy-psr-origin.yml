name: Deploy PSR Origin / Sonu Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-SONU to deploy psr-property and apply the Sonu Durable Object migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY-SONU' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - run: npm ci
      - run: chmod +x scripts/*.sh
      - name: Verify source
        run: npm run test:source
      - name: Deploy psr-property origin and apply Sonu DO rename
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Smoke test direct PSR origin
        run: |
          curl --fail --silent --show-error --max-time 20 https://psr.espacios.me/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://psr.espacios.me/projects >/dev/null
