name: Deploy PSR Origin / Sonu Compatibility

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-SONU-COMPAT to deploy psr-property without renaming the Durable Object class'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY-SONU-COMPAT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - run: npm ci
      - run: chmod +x scripts/*.sh
      - name: Verify source and compatibility manifest
        run: |
          npm run test:source
          # test:source builds dist/client. public/ is gitignored, so that
          # directory does not contain the live media tree. wrangler deploy
          # replaces the Workers asset manifest with whatever is in dist/client.
          node scripts/assert-deployable-assets.mjs
          npx wrangler deploy --dry-run --config wrangler.jsonc
          if grep -q '"renamed_classes"' wrangler.jsonc; then
            echo "Blocked: compatibility deploy must not contain a Durable Object class rename"
            exit 1
          fi
          grep -q '"name": "SONU_PUBLIC_AGENT"' wrangler.jsonc
          grep -q '"class_name": "GracePublicAgent"' wrangler.jsonc
      - name: Deploy psr-property compatibility release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Smoke test direct PSR origin
        run: |
          curl --fail --silent --show-error --max-time 20 https://psr.espacios.me/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://psr.espacios.me/projects >/dev/null
